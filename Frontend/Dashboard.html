<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Dashboard</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>

<body>

  <main class="auth-page">

    <section class="auth-card">

      <div class="logo">
        LoRA Cloud
      </div>

      <h1 id="welcome">
        Loading...
      </h1>

      <p
        id="userEmail"
        class="subtitle"
      ></p>

      <p id="plan"></p>

      <button id="logoutButton">
        Logout
      </button>

    </section>

  </main>


  <script>

    const API_URL =
      "https://YOUR-RENDER-BACKEND.onrender.com";


    async function loadUser() {

      try {

        const response =
          await fetch(
            `${API_URL}/api/auth/me`,
            {
              credentials: "include"
            }
          );


        const data =
          await response.json();


        if (!response.ok) {

          window.location.href =
            "login.html";

          return;
        }


        document
          .getElementById("welcome")
          .textContent =
          `Welcome, ${data.user.name}`;


        document
          .getElementById("userEmail")
          .textContent =
          data.user.email;


        document
          .getElementById("plan")
          .textContent =
          `Plan: ${data.user.plan}`;


      } catch (error) {

        window.location.href =
          "login.html";

      }

    }


    document
      .getElementById("logoutButton")
      .addEventListener(
        "click",
        async () => {

          await fetch(
            `${API_URL}/api/auth/logout`,
            {
              method: "POST",

              credentials: "include"
            }
          );


          window.location.href =
            "login.html";

        }
      );


    loadUser();

  </script>

</body>

</html>
